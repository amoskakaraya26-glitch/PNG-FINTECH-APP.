name: PNG FinTech CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main
      - master
      - ledger-upgrade

jobs:
  build-and-test:
    name: Build & Test

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run unit tests
        run: npm test