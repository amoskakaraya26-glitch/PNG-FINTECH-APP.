services:
  - type: web
    name: png-fintech-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build && cd src/app && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: png-wallet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://png-fintech-api.onrender.com

databases:
  - name: png-wallet-db
    databaseName: png_wallet_db
    user: png_wallet_user
    region: singapore
    plan: free
